services:
  linktree:
    build: .
    image: linktree-host:latest
    container_name: linktree-host
    restart: unless-stopped
    environment:
      - PORT=3000
      - STATS_USER=${STATS_USER:-admin}
      - STATS_PASS=${STATS_PASS:?set STATS_PASS in .env}
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    networks:
      - npm_network

networks:
  npm_network:
    external: true
    name: ${NPM_NETWORK_NAME:?set NPM_NETWORK_NAME in .env after checking: docker network ls}
